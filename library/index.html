<!DOCTYPE html>
<html lang="id" data-theme="light" data-sky="senja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<script>try{var _t=null,_s=null;try{_t=localStorage.getItem('theme');_s=localStorage.getItem('ms-sky')}catch(e){}
var dk=_t==='dark'||(_t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
var sky=(_s==='fajar'||_s==='senja'||_s==='malam')?_s:(dk?'malam':'senja');
document.documentElement.setAttribute('data-sky',sky);
document.documentElement.setAttribute('data-theme',sky==='malam'?'dark':'light');}catch(e){}</script>
<meta name="description" content="Library — koleksi favorit Cyrro: mini game, playlist, dan tool."/>
<meta name="theme-color" content="#3b2a6b"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E"/>
<title>Library — Cyrro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* ───────── palet langit (ala Alto) ───────── */
:root,[data-sky="senja"]{
  --sun-x:68%;--sun-y:56%;--sun-size:150px;--sun-core:#fff1c9;--sun-glow:rgba(255,190,130,.75);
  --d1:#a2527f;--d2:#7d3f78;--d3:#57296a;--d4:#341a4d;
  --panel:rgba(52,26,77,.34);--panel-line:rgba(255,255,255,.22);
  --star:0;--mist:rgba(255,196,150,.35);
}
[data-sky="fajar"]{
  --sun-x:26%;--sun-y:62%;--sun-size:130px;--sun-core:#fffbe6;--sun-glow:rgba(255,236,190,.85);
  --d1:#e3a0a4;--d2:#c4809c;--d3:#9a6592;--d4:#6d4c86;
  --panel:rgba(86,56,120,.30);--panel-line:rgba(255,255,255,.3);
  --star:0;--mist:rgba(255,240,215,.5);
}
[data-sky="malam"]{
  --sun-x:74%;--sun-y:24%;--sun-size:84px;--sun-core:#f6f3ff;--sun-glow:rgba(170,170,255,.45);
  --d1:#2f2f66;--d2:#222254;--d3:#16163c;--d4:#0b0b26;
  --panel:rgba(8,8,32,.42);--panel-line:rgba(190,190,255,.2);
  --star:1;--mist:rgba(120,110,200,.18);
}

html{overflow-x:hidden;scrollbar-gutter:stable;}
body{
  min-height:100vh;min-height:100dvh;background:#2a1b4a;color:#fff;
  font-family:'Outfit',sans-serif;font-weight:300;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ───────── latar ───────── */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;}
[data-sky="fajar"] .sky.fajar,[data-sky="senja"] .sky.senja,[data-sky="malam"] .sky.malam{opacity:1;}
.sky.fajar{background:linear-gradient(180deg,#7eaed6 0%,#c3b6dc 38%,#f6c7c3 68%,#ffe9c9 100%);}
.sky.senja{background:linear-gradient(180deg,#34265f 0%,#7a3f7e 34%,#d36f84 62%,#ffb47c 100%);}
.sky.malam{background:linear-gradient(180deg,#05081a 0%,#0f1538 42%,#232155 76%,#3a3070 100%);}

#stars{position:absolute;inset:0;opacity:var(--star);transition:opacity 1.2s ease;}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}

#sun{
  position:absolute;left:var(--sun-x);top:var(--sun-y);
  width:var(--sun-size);height:var(--sun-size);margin:calc(var(--sun-size)/-2) 0 0 calc(var(--sun-size)/-2);
  border-radius:50%;background:var(--sun-core);
  box-shadow:0 0 0 calc(var(--sun-size)*.35) rgba(255,255,255,.07),0 0 calc(var(--sun-size)*1.4) calc(var(--sun-size)*.5) var(--sun-glow);
  transition:left 1.4s ease,top 1.4s ease,width 1.4s ease,height 1.4s ease,margin 1.4s ease,background 1.2s,box-shadow 1.2s;
}

.cloud{position:absolute;height:14px;border-radius:14px;background:var(--mist);filter:blur(7px);animation:drift linear infinite;transition:background 1.2s;}
.cloud.c1{width:300px;top:20%;left:-320px;animation-duration:150s;}
.cloud.c2{width:200px;top:34%;left:-220px;animation-duration:190s;animation-delay:-70s;height:10px;}
.cloud.c3{width:380px;top:46%;left:-400px;animation-duration:230s;animation-delay:-150s;}
@keyframes drift{to{transform:translateX(calc(100vw + 760px));}}

.bird{position:absolute;width:18px;height:8px;opacity:.55;animation:fly linear infinite;}
.bird svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.4;stroke-linecap:round;}
.bird.b1{top:26%;left:-30px;animation-duration:60s;animation-delay:-20s;}
.bird.b2{top:30%;left:-30px;animation-duration:68s;animation-delay:-14s;transform:scale(.7);}
@keyframes fly{
  0%{transform:translate(0,0)}
  50%{transform:translate(55vw,-26px)}
  100%{transform:translate(112vw,8px)}
}

#dunes{position:absolute;left:-3%;right:-3%;bottom:0;height:46vh;min-height:260px;}
#dunes svg{position:absolute;left:0;bottom:0;width:100%;height:100%;display:block;transition:transform .5s ease-out;}
#dunes path{transition:fill 1.2s ease;}
.l1 path{fill:var(--d1)}.l2 path{fill:var(--d2)}.l3 path{fill:var(--d3)}.l4 path{fill:var(--d4)}
.l1{height:92%!important}.l2{height:74%!important}.l3{height:54%!important}.l4{height:34%!important}

/* ───────── nav ───────── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:calc(1rem + env(safe-area-inset-top,0px)) 1.6rem 1rem;
  display:flex;justify-content:space-between;align-items:center;
}
.nav-left{display:flex;align-items:center;gap:1rem;}
.nav-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:1.3rem;color:#fff;text-decoration:none;letter-spacing:.04em;text-shadow:0 1px 10px rgba(0,0,0,.25);}
.pill{
  font:400 .8rem 'Outfit',sans-serif;letter-spacing:.06em;color:#fff;text-decoration:none;cursor:pointer;
  padding:.45rem .95rem;border-radius:999px;border:1px solid var(--panel-line);
  background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .25s,border-color .25s;
}
.pill:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);}

/* ───────── konten ───────── */
main{
  position:relative;z-index:1;max-width:980px;margin:0 auto;
  padding:calc(5.6rem + env(safe-area-inset-top,0px)) 1rem calc(3rem + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;
}
h1{
  font-weight:200;font-size:clamp(2.1rem,9vw,3.6rem);letter-spacing:.14em;line-height:1.1;
  text-align:center;text-shadow:0 2px 24px rgba(40,10,60,.35);
}
.sub{margin-top:.7rem;font-size:.92rem;letter-spacing:.04em;color:rgba(255,255,255,.82);text-align:center;max-width:34ch;line-height:1.55;text-shadow:0 1px 12px rgba(40,10,60,.35);}

.panel{
  margin-top:1.6rem;width:max-content;max-width:100%;min-width:min(100%,330px);
  background:var(--panel);border:1px solid var(--panel-line);border-radius:26px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:1.1rem;box-shadow:0 24px 70px rgba(20,5,40,.3),inset 0 1px 0 rgba(255,255,255,.14);
  transition:background 1.2s,border-color 1.2s;
}

.sec{margin-top:1.8rem;width:min(100%,460px);padding:1.2rem 1.1rem 1.1rem;border-radius:28px;background:var(--panel);border:1px solid var(--panel-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(20,5,40,.3),inset 0 1px 0 rgba(255,255,255,.14);}
.sh{display:flex;align-items:center;gap:.8rem;padding:0 .4rem .9rem;}
.sh h2{font-weight:300;font-size:1.2rem;letter-spacing:.12em;white-space:nowrap;}
.sh i{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.4),transparent);}
.sh span{font-size:.72rem;letter-spacing:.1em;padding:.2rem .65rem;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--panel-line);}
.sec ol{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem;counter-reset:n;}
.sec li{min-width:0;}
.row{--a1:#ffb067;--a2:#ff7a8a;position:relative;display:flex;align-items:center;gap:.75rem;padding:.8rem .8rem .8rem .6rem;border-radius:20px;max-width:100%;color:#fff;text-decoration:none;overflow:hidden;counter-increment:n;background:linear-gradient(120deg,color-mix(in srgb,var(--a1) 22%,transparent),rgba(255,255,255,.07) 70%);border:1px solid rgba(255,255,255,.14);transition:transform .3s cubic-bezier(.3,1.4,.5,1),border-color .25s,background .25s;opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0ms);}
.row::before{content:'0'counter(n);min-width:2ch;font:200 1.9rem/1 'Outfit',sans-serif;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.55);text-align:center;}
.row .tile{width:50px;height:50px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.65rem;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 22px color-mix(in srgb,var(--a2) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .35s cubic-bezier(.3,1.6,.5,1);}
.row .tx{flex:1;min-width:0;}
.row b{display:block;font-weight:500;font-size:1.08rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row small{display:inline-block;margin-top:.3rem;font-size:.66rem;letter-spacing:.08em;padding:.15rem .6rem;border-radius:999px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);}
.row .go{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);transition:background .25s,color .25s,transform .3s cubic-bezier(.3,1.5,.5,1);}
.row .go svg{width:14px;height:14px;fill:currentColor;margin-left:2px;}
@media (hover:hover){.row:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.45);}.row:hover .tile{transform:rotate(-7deg) scale(1.08);}.row:hover .go{background:#fff;color:#4a2a63;transform:scale(1.08);}}
.row:active{transform:scale(.97);}
.r2{--a1:#b58cff;--a2:#ff8fb1;}.r4{--a1:#c78bff;--a2:#c23b7a;}.r5{--a1:#ff8a5c;--a2:#d6393b;}
.row .tile.img{padding:0;overflow:hidden;background:#2d0b40 center/cover no-repeat;}.r3{--a1:#6fd3c4;--a2:#7aa8ff;}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:600px){
  nav{padding-left:1rem;padding-right:1rem;}
  .panel{padding:.8rem;border-radius:20px;}
}
@media (prefers-reduced-motion:reduce){.cloud,.bird,#stars i,.row,.row .tile,.row .go{animation:none!important;transition:none!important;opacity:1!important;}}
</style>
</head>
<body>
<div id="scene" aria-hidden="true">
  <div class="sky fajar"></div><div class="sky senja"></div><div class="sky malam"></div>
  <div id="stars"></div>
  <div id="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="bird b1"><svg viewBox="0 0 18 8"><path d="M1 6 Q5 0 9 4 Q13 0 17 6"/></svg></div>
  <div class="bird b2"><svg viewBox="0 0 18 8"><path d="M1 6 Q5 0 9 4 Q13 0 17 6"/></svg></div>
  <div id="dunes">
    <svg class="l1" data-p=".012" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 120 C180 40 360 70 540 110 C720 150 900 60 1080 50 C1260 40 1360 90 1440 70 L1440 300 L0 300Z"/></svg>
    <svg class="l2" data-p=".022" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 90 C140 130 300 150 480 110 C660 70 820 30 1000 70 C1180 110 1300 140 1440 100 L1440 300 L0 300Z"/></svg>
    <svg class="l3" data-p=".034" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 110 C200 60 380 40 560 80 C740 120 900 150 1100 110 C1260 80 1360 60 1440 80 L1440 300 L0 300Z"/></svg>
    <svg class="l4" data-p=".05" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 70 C160 110 320 130 500 100 C700 66 860 44 1060 84 C1240 120 1340 110 1440 80 L1440 300 L0 300Z"/></svg>
  </div>
</div>

<nav>
  <div class="nav-left">
    <a class="nav-logo" href="/">cyrro</a>
    <button class="pill" id="skyBtn" title="Ganti suasana langit">senja</button>
  </div>
  <a class="pill" href="/">← kembali</a>
</nav>

<main>
  <h1>library</h1>
  <section class="sec">
    <div class="sh"><h2>mini game</h2><i></i></div>
    <ol>
      <li><a class="row r1" style="--d:120ms" href="/library/minigame/sudoku/"><span class="tile" aria-hidden="true">🔢</span><span class="tx"><b>Sudoku</b></span><span class="go" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M6 3.5v13l11-6.5z"/></svg></span></a></li>
      <li><a class="row r2" style="--d:240ms" href="/library/minigame/minesweeper/"><span class="tile" aria-hidden="true">💣</span><span class="tx"><b>Minesweeper</b></span><span class="go" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M6 3.5v13l11-6.5z"/></svg></span></a></li>
      <li><a class="row r3" style="--d:360ms" href="/library/minigame/blockblast/"><span class="tile" aria-hidden="true">🧱</span><span class="tx"><b>Block Blast</b></span><span class="go" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M6 3.5v13l11-6.5z"/></svg></span></a></li>
    </ol>
  </section>
  <section class="sec">
    <div class="sh"><h2>playlist</h2><i></i></div>
    <ol>
      <li><a class="row r4" style="--d:480ms" href="https://music.youtube.com/playlist?list=PLawOvByz18PU&amp;si=MDmpCU9IhHpjT03b" target="_blank" rel="noopener"><span class="tile img" style="background-image:url(/library/cyrrokestra.jpg)" aria-hidden="true"></span><span class="tx"><b>Cyrrokestra</b></span><span class="go" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M6 3.5v13l11-6.5z"/></svg></span></a></li>
      <li><a class="row r5" style="--d:600ms" href="https://open.spotify.com/playlist/2yy0e4HnH20DYLtXdOfDkO?si=8CSpxOhLQg6NzkH2J3uH2A&amp;utm_source=copy-link&amp;pi=1tCrkggXS6Kpg" target="_blank" rel="noopener"><span class="tile img" style="background-image:url(/library/rocknroll.jpg)" aria-hidden="true"></span><span class="tx"><b>Rock'n'Roll S</b></span><span class="go" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M6 3.5v13l11-6.5z"/></svg></span></a></li>
    </ol>
  </section>
</main>
<script>
(function(){
  var root=document.documentElement,skyBtn=document.getElementById('skyBtn'),SKIES=['fajar','senja','malam'];
  skyBtn.textContent=root.getAttribute('data-sky');
  skyBtn.addEventListener('click',function(){var n=SKIES[(SKIES.indexOf(root.getAttribute('data-sky'))+1)%3];root.setAttribute('data-sky',n);root.setAttribute('data-theme',n==='malam'?'dark':'light');skyBtn.textContent=n;try{localStorage.setItem('ms-sky',n);localStorage.setItem('theme',n==='malam'?'dark':'light');}catch(e){}});
  var st=document.getElementById('stars'),fr=document.createDocumentFragment();
  for(var s=0;s<70;s++){var i=document.createElement('i');i.style.left=Math.random()*100+'%';i.style.top=Math.random()*62+'%';var z=Math.random()<.2?3:2;i.style.width=i.style.height=z+'px';i.style.animationDelay=-Math.random()*4+'s';i.style.animationDuration=3+Math.random()*3+'s';fr.appendChild(i);}
  st.appendChild(fr);
  var layers=document.querySelectorAll('#dunes svg');
  window.addEventListener('pointermove',function(e){var dx=e.clientX/window.innerWidth-.5;layers.forEach(function(l){l.style.transform='translateX('+(-dx*parseFloat(l.dataset.p)*600)+'px)';});},{passive:true});
})();
</script>
</body>
</html>
