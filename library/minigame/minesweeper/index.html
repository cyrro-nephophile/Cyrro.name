<!DOCTYPE html>
<html lang="id" data-theme="light" data-sky="senja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<script>try{var _t=null,_s=null;try{_t=localStorage.getItem('theme');_s=localStorage.getItem('ms-sky')}catch(e){}
var dk=_t==='dark'||(_t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
var sky=(_s==='fajar'||_s==='senja'||_s==='malam')?_s:(dk?'malam':'senja');
document.documentElement.setAttribute('data-sky',sky);
document.documentElement.setAttribute('data-theme',sky==='malam'?'dark':'light');}catch(e){}</script>
<meta name="description" content="Minesweeper — minigame dari Cyrro, dengan suasana bukit pasir di senja hari."/>
<meta name="theme-color" content="#3b2a6b"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9C%EF%B8%8F%3C/text%3E%3C/svg%3E"/>
<title>Minesweeper — Cyrro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* ───────── palet langit (ala Alto) ───────── */
:root,[data-sky="senja"]{
  --sun-x:68%;--sun-y:56%;--sun-size:150px;--sun-core:#fff1c9;--sun-glow:rgba(255,190,130,.75);
  --d1:#a2527f;--d2:#7d3f78;--d3:#57296a;--d4:#341a4d;
  --panel:rgba(52,26,77,.34);--panel-line:rgba(255,255,255,.22);
  --star:0;--mist:rgba(255,196,150,.35);
}
[data-sky="fajar"]{
  --sun-x:26%;--sun-y:62%;--sun-size:130px;--sun-core:#fffbe6;--sun-glow:rgba(255,236,190,.85);
  --d1:#e3a0a4;--d2:#c4809c;--d3:#9a6592;--d4:#6d4c86;
  --panel:rgba(86,56,120,.30);--panel-line:rgba(255,255,255,.3);
  --star:0;--mist:rgba(255,240,215,.5);
}
[data-sky="malam"]{
  --sun-x:74%;--sun-y:24%;--sun-size:84px;--sun-core:#f6f3ff;--sun-glow:rgba(170,170,255,.45);
  --d1:#2f2f66;--d2:#222254;--d3:#16163c;--d4:#0b0b26;
  --panel:rgba(8,8,32,.42);--panel-line:rgba(190,190,255,.2);
  --star:1;--mist:rgba(120,110,200,.18);
}

html{overflow-x:hidden;scrollbar-gutter:stable;}
body{
  min-height:100vh;min-height:100dvh;background:#2a1b4a;color:#fff;
  font-family:'Outfit',sans-serif;font-weight:300;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ───────── latar ───────── */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;}
[data-sky="fajar"] .sky.fajar,[data-sky="senja"] .sky.senja,[data-sky="malam"] .sky.malam{opacity:1;}
.sky.fajar{background:linear-gradient(180deg,#7eaed6 0%,#c3b6dc 38%,#f6c7c3 68%,#ffe9c9 100%);}
.sky.senja{background:linear-gradient(180deg,#34265f 0%,#7a3f7e 34%,#d36f84 62%,#ffb47c 100%);}
.sky.malam{background:linear-gradient(180deg,#05081a 0%,#0f1538 42%,#232155 76%,#3a3070 100%);}

#stars{position:absolute;inset:0;opacity:var(--star);transition:opacity 1.2s ease;}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}

#sun{
  position:absolute;left:var(--sun-x);top:var(--sun-y);
  width:var(--sun-size);height:var(--sun-size);margin:calc(var(--sun-size)/-2) 0 0 calc(var(--sun-size)/-2);
  border-radius:50%;background:var(--sun-core);
  box-shadow:0 0 0 calc(var(--sun-size)*.35) rgba(255,255,255,.07),0 0 calc(var(--sun-size)*1.4) calc(var(--sun-size)*.5) var(--sun-glow);
  transition:left 1.4s ease,top 1.4s ease,width 1.4s ease,height 1.4s ease,margin 1.4s ease,background 1.2s,box-shadow 1.2s;
}

.cloud{position:absolute;height:14px;border-radius:14px;background:var(--mist);filter:blur(7px);animation:drift linear infinite;transition:background 1.2s;}
.cloud.c1{width:300px;top:20%;left:-320px;animation-duration:150s;}
.cloud.c2{width:200px;top:34%;left:-220px;animation-duration:190s;animation-delay:-70s;height:10px;}
.cloud.c3{width:380px;top:46%;left:-400px;animation-duration:230s;animation-delay:-150s;}
@keyframes drift{to{transform:translateX(calc(100vw + 760px));}}

.bird{position:absolute;width:18px;height:8px;opacity:.55;animation:fly linear infinite;}
.bird svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.4;stroke-linecap:round;}
.bird.b1{top:26%;left:-30px;animation-duration:60s;animation-delay:-20s;}
.bird.b2{top:30%;left:-30px;animation-duration:68s;animation-delay:-14s;transform:scale(.7);}
@keyframes fly{
  0%{transform:translate(0,0)}
  50%{transform:translate(55vw,-26px)}
  100%{transform:translate(112vw,8px)}
}

#dunes{position:absolute;left:-3%;right:-3%;bottom:0;height:46vh;min-height:260px;}
#dunes svg{position:absolute;left:0;bottom:0;width:100%;height:100%;display:block;transition:transform .5s ease-out;}
#dunes path{transition:fill 1.2s ease;}
.l1 path{fill:var(--d1)}.l2 path{fill:var(--d2)}.l3 path{fill:var(--d3)}.l4 path{fill:var(--d4)}
.l1{height:92%!important}.l2{height:74%!important}.l3{height:54%!important}.l4{height:34%!important}

/* ───────── nav ───────── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:calc(1rem + env(safe-area-inset-top,0px)) 1.6rem 1rem;
  display:flex;justify-content:space-between;align-items:center;
}
.nav-left{display:flex;align-items:center;gap:1rem;}
.nav-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:1.3rem;color:#fff;text-decoration:none;letter-spacing:.04em;text-shadow:0 1px 10px rgba(0,0,0,.25);}
.pill{
  font:400 .8rem 'Outfit',sans-serif;letter-spacing:.06em;color:#fff;text-decoration:none;cursor:pointer;
  padding:.45rem .95rem;border-radius:999px;border:1px solid var(--panel-line);
  background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .25s,border-color .25s;
}
.pill:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);}

/* ───────── konten ───────── */
main{
  position:relative;z-index:1;max-width:980px;margin:0 auto;
  padding:calc(5.6rem + env(safe-area-inset-top,0px)) 1rem calc(3rem + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;
}
h1{
  font-weight:200;font-size:clamp(2.1rem,9vw,3.6rem);letter-spacing:.14em;line-height:1.1;
  text-align:center;text-shadow:0 2px 24px rgba(40,10,60,.35);
}
.sub{margin-top:.7rem;font-size:.92rem;letter-spacing:.04em;color:rgba(255,255,255,.82);text-align:center;max-width:34ch;line-height:1.55;text-shadow:0 1px 12px rgba(40,10,60,.35);}

.panel{
  margin-top:1.6rem;width:max-content;max-width:100%;min-width:min(100%,330px);
  background:var(--panel);border:1px solid var(--panel-line);border-radius:26px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:1.1rem;box-shadow:0 24px 70px rgba(20,5,40,.3),inset 0 1px 0 rgba(255,255,255,.14);
  transition:background 1.2s,border-color 1.2s;
}

/* segmented level */
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;margin:0 auto 1.1rem;max-width:320px;
  border-radius:999px;background:rgba(0,0,0,.18);border:1px solid var(--panel-line);}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:#fff;
  box-shadow:0 4px 14px rgba(30,5,50,.3);transform:translateX(calc(var(--i,0)*100%));
  transition:transform .35s cubic-bezier(.3,1.3,.5,1);}
.lv{position:relative;z-index:1;font:400 .8rem 'Outfit',sans-serif;letter-spacing:.08em;color:rgba(255,255,255,.8);cursor:pointer;
  padding:.5rem .4rem;border-radius:999px;border:none;background:transparent;transition:color .25s;}
.lv small{display:block;font-size:.6rem;letter-spacing:.04em;opacity:.65;margin-top:1px;}
.lv.on{color:#4a2a63;font-weight:500;}
[data-sky="malam"] .lv.on{color:#1a1a4a;}

/* hud */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.7rem;margin-bottom:.8rem;}
.stat{display:flex;align-items:center;gap:.55rem;padding:.5rem .8rem;border-radius:14px;
  background:rgba(0,0,0,.16);border:1px solid var(--panel-line);}
.stat.r{justify-content:flex-end;}
.stat svg{width:18px;height:18px;flex:none;stroke:rgba(255,255,255,.75);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.stat span{font:300 1.55rem/1 'Outfit',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.05em;min-width:2.6ch;text-align:center;}
.face{width:56px;height:56px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);box-shadow:0 6px 18px rgba(30,5,50,.22);
  transition:background .25s,transform .18s cubic-bezier(.3,1.5,.5,1);}
.face:hover{background:rgba(255,255,255,.28);transform:rotate(-8deg) scale(1.05);}
.face:active{transform:scale(.9);}
.face svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;}
.face svg .eye{fill:#fff;stroke:none;}
.face.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1);}
@keyframes bump{0%{transform:scale(.7) rotate(-12deg)}100%{transform:none}}

.prog{height:4px;border-radius:4px;background:rgba(0,0,0,.2);overflow:hidden;margin-bottom:.9rem;}
.prog i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#ffd9a0,#fff);transition:width .4s ease;}

.boardwrap{position:relative;border-radius:16px;}
.scroller{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:3px;-webkit-overflow-scrolling:touch;}
#board{
  display:grid;gap:3px;width:max-content;margin:0 auto;
  grid-template-columns:repeat(var(--cols),var(--cs));
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
#board.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

.cell{
  width:var(--cs);height:var(--cs);border-radius:max(4px,calc(var(--cs)*.26));
  display:flex;align-items:center;justify-content:center;
  font:400 calc(var(--cs)*.54)/1 'Outfit',sans-serif;
  cursor:pointer;-webkit-touch-callout:none;
  transition:transform .12s ease,background .18s ease,box-shadow .18s ease;
}
.cell.up{background:rgba(255,255,255,.27);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 rgba(0,0,0,.12);}
@media (hover:hover){.cell.up:hover{background:rgba(255,255,255,.44);transform:translateY(-1px);}}
.cell.up:active{transform:scale(.84);background:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);}
.cell.open{background:rgba(25,8,45,.26);cursor:default;}
[data-sky="malam"] .cell.open{background:rgba(0,0,20,.4);}
.cell svg{width:62%;height:62%;display:block;}
.cell.mine{background:rgba(25,8,45,.4);}
.cell.boom{background:#ff6b5e;animation:boom .6s ease-out;}
@keyframes boom{0%{transform:scale(.6)}35%{transform:scale(1.35);box-shadow:0 0 0 0 rgba(255,107,94,.8)}100%{transform:scale(1);box-shadow:0 0 0 22px rgba(255,107,94,0)}}
.cell.wrong{background:rgba(255,160,90,.4);}
.cell.open[class*=" n"]{font-weight:500;}

.cell.pop{animation:pop .36s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:var(--d,0ms);}
@keyframes pop{
  0%{transform:scale(.35);opacity:0;background:rgba(255,255,255,.6)}
  55%{transform:scale(1.12);opacity:1}
  100%{transform:scale(1)}
}
.cell.flagged svg{animation:plant .42s cubic-bezier(.3,1.5,.5,1);}
@keyframes plant{0%{transform:translateY(-10px) scale(1.5) rotate(-18deg);opacity:0}100%{transform:none;opacity:1}}
.cell.cheer{animation:cheer .7s ease-in-out;animation-delay:var(--d,0ms);}
@keyframes cheer{0%,100%{transform:none}40%{transform:scale(1.18);background:rgba(255,224,150,.55);box-shadow:0 0 14px rgba(255,214,140,.7)}}
.cell.hint{animation:hintp .6s ease-in-out 3;box-shadow:0 0 0 2px #ffe08a inset;}
@keyframes hintp{50%{background:rgba(255,224,138,.7);transform:scale(1.1)}}
.n1{color:#a9d4ff}.n2{color:#a6efb8}.n3{color:#ff9d9d}.n4{color:#dbb0ff}
.n5{color:#ffd884}.n6{color:#86eeee}.n7{color:#fff}.n8{color:#d0c6ea}

/* kartu hasil */
.result{position:absolute;inset:-4px;display:flex;align-items:center;justify-content:center;padding:.6rem;
  border-radius:18px;background:rgba(20,6,38,.34);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility 0s linear .35s;z-index:3;}
.result.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .35s ease,visibility 0s;}
.rcard{width:min(100%,290px);text-align:center;padding:1.3rem 1.1rem 1.1rem;border-radius:22px;
  background:var(--panel);border:1px solid rgba(255,255,255,.3);box-shadow:0 18px 50px rgba(10,0,25,.45);
  transform:translateY(14px) scale(.94);transition:transform .5s cubic-bezier(.3,1.4,.5,1);}
[data-sky="senja"] .rcard,[data-sky="fajar"] .rcard{background:rgba(70,36,98,.72);}
[data-sky="malam"] .rcard{background:rgba(12,12,44,.8);}
.result.show .rcard{transform:none;}
.rcard .ric{width:54px;height:54px;margin:0 auto .7rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);}
.rcard .ric svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;}
.rcard .ric svg .eye{fill:#fff;stroke:none;}
.rcard h2{font-weight:200;font-size:1.7rem;letter-spacing:.1em;}
.rcard p{margin-top:.35rem;font-size:.85rem;line-height:1.5;color:rgba(255,255,255,.8);}
.rcard .badge{display:inline-block;margin-top:.55rem;padding:.2rem .7rem;border-radius:999px;background:#ffd9a0;color:#5a3010;font-size:.72rem;letter-spacing:.08em;font-weight:500;}
.rcard .badge[hidden]{display:none;}
.racts{display:grid;gap:.45rem;margin-top:1rem;}

.btn{font:500 .85rem 'Outfit',sans-serif;letter-spacing:.06em;cursor:pointer;padding:.7rem 1rem;border-radius:999px;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.1);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  transition:background .2s,transform .15s cubic-bezier(.3,1.5,.5,1),opacity .2s;}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.btn:hover{background:rgba(255,255,255,.22);}
.btn:active{transform:scale(.95);}
.btn.primary{background:#fff;color:#4a2a63;border-color:#fff;box-shadow:0 6px 18px rgba(30,5,50,.3);}
[data-sky="malam"] .btn.primary{color:#1a1a4a;}
.btn.primary:hover{background:#fff4e2;}
.btn.ghost{border-color:transparent;background:transparent;font-weight:400;color:rgba(255,255,255,.75);padding:.4rem;}
.btn.on{background:rgba(255,196,120,.92);border-color:transparent;color:#4a2a1a;}
.btn[disabled]{opacity:.38;pointer-events:none;}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:1rem;}
.acts .btn{padding:.65rem .7rem;font-size:.8rem;}

.msg{min-height:1.2rem;margin-top:.8rem;text-align:center;font-size:.86rem;letter-spacing:.03em;color:rgba(255,255,255,.85);}
.best{margin-top:.15rem;text-align:center;font-size:.7rem;letter-spacing:.1em;color:rgba(255,255,255,.6);min-height:1rem;}

.help{margin-top:1.4rem;max-width:44ch;font-size:.82rem;line-height:1.75;color:rgba(255,255,255,.8);text-align:center;text-shadow:0 1px 10px rgba(40,10,60,.4);}
.help b{font-weight:500;color:#fff;}

@media (max-width:600px){
  nav{padding-left:1rem;padding-right:1rem;}
  .panel{padding:.8rem;border-radius:20px;}
}
@media (prefers-reduced-motion:reduce){.cloud,.bird,#stars i,.cell,.cell svg,#board{animation:none!important;}}
</style>
</head>
<body>
<div id="scene" aria-hidden="true">
  <div class="sky fajar"></div><div class="sky senja"></div><div class="sky malam"></div>
  <div id="stars"></div>
  <div id="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="bird b1"><svg viewBox="0 0 18 8"><path d="M1 6 Q5 0 9 4 Q13 0 17 6"/></svg></div>
  <div class="bird b2"><svg viewBox="0 0 18 8"><path d="M1 6 Q5 0 9 4 Q13 0 17 6"/></svg></div>
  <div id="dunes">
    <svg class="l1" data-p=".012" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 120 C180 40 360 70 540 110 C720 150 900 60 1080 50 C1260 40 1360 90 1440 70 L1440 300 L0 300Z"/></svg>
    <svg class="l2" data-p=".022" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 90 C140 130 300 150 480 110 C660 70 820 30 1000 70 C1180 110 1300 140 1440 100 L1440 300 L0 300Z"/></svg>
    <svg class="l3" data-p=".034" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 110 C200 60 380 40 560 80 C740 120 900 150 1100 110 C1260 80 1360 60 1440 80 L1440 300 L0 300Z"/></svg>
    <svg class="l4" data-p=".05" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 70 C160 110 320 130 500 100 C700 66 860 44 1060 84 C1240 120 1340 110 1440 80 L1440 300 L0 300Z"/></svg>
  </div>
</div>

<nav>
  <div class="nav-left">
    <a class="nav-logo" href="/">cyrro</a>
    <button class="pill" id="skyBtn" title="Ganti suasana langit">senja</button>
  </div>
  <a class="pill" href="/library/">← library</a>
</nav>

<main>
  <h1>minesweeper</h1>
  <p class="sub">Sapu bukit pasir pelan-pelan. Jangan injak ranjaunya.</p>

  <section class="panel">
    <div class="seg" id="seg" style="--i:0">
      <span class="thumb"></span>
      <button class="lv" data-k="mudah">mudah<small>9×9</small></button>
      <button class="lv" data-k="sedang">sedang<small>16×16</small></button>
      <button class="lv" data-k="sulit">sulit<small>16×30</small></button>
    </div>

    <div class="hud">
      <div class="stat"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.4"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2 2M13.7 13.7l2 2M15.7 4.3l-2 2M6.3 13.7l-2 2"/></svg><span id="mines">010</span></div>
      <button class="face" id="face" title="Main lagi" aria-label="Main lagi"></button>
      <div class="stat r"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.4"/><path d="M10 5.6V10l3 2"/></svg><span id="time">000</span></div>
    </div>
    <div class="prog" aria-hidden="true"><i id="prog"></i></div>

    <div class="boardwrap">
      <div class="scroller"><div id="board" role="grid" aria-label="Papan Minesweeper"></div></div>
      <div class="result" id="result" aria-live="polite">
        <div class="rcard">
          <div class="ric" id="rIcon"></div>
          <h2 id="rTitle"></h2>
          <p id="rText"></p>
          <span class="badge" id="rBadge" hidden>REKOR BARU</span>
          <div class="racts">
            <button class="btn primary" id="rNew"><svg viewBox="0 0 20 20"><path d="M7 4.5v11l9-5.5z"/></svg>Main lagi</button>
            <button class="btn" id="rRetry"><svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M16 3v3.5h-3.5"/></svg>Ulangi papan ini</button>
            <button class="btn ghost" id="rView">lihat papan</button>
          </div>
        </div>
      </div>
    </div>

    <div class="acts">
      <button class="btn" id="flagMode"><svg viewBox="0 0 20 20"><path d="M5 17V3"/><path d="M5.6 3.6L15 7l-9.4 3.6"/></svg>Bendera</button>
      <button class="btn" id="hintBtn"><svg viewBox="0 0 20 20"><path d="M7.5 14.5h5M8 17h4M10 2.5a5 5 0 0 0-2.7 9.2c.4.3.7.8.7 1.3h4c0-.5.3-1 .7-1.3A5 5 0 0 0 10 2.5z"/></svg>Petunjuk</button>
      <button class="btn" id="retryBtn" disabled><svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M16 3v3.5h-3.5"/></svg>Ulangi</button>
      <button class="btn primary" id="newBtn"><svg viewBox="0 0 20 20"><path d="M7 4.5v11l9-5.5z"/></svg>Main lagi</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="best" id="best"></div>
  </section>

  <p class="help">
    <b>Klik</b> untuk membuka kotak, <b>klik kanan</b> atau <b>tahan lama</b> untuk memasang bendera.
    Klik angka yang benderanya sudah pas untuk membuka kotak di sekelilingnya.
    Klik pertama selalu aman.
  </p>
</main>

<script>
(function(){
  /* ── langit: fajar → senja → malam (tema terang/gelap tetap sinkron dengan situs utama) ── */
  var root=document.documentElement, skyBtn=document.getElementById('skyBtn');
  var SKIES=['fajar','senja','malam'];
  skyBtn.textContent=root.getAttribute('data-sky');
  skyBtn.addEventListener('click',function(){
    var cur=root.getAttribute('data-sky'),n=SKIES[(SKIES.indexOf(cur)+1)%3];
    root.setAttribute('data-sky',n);
    root.setAttribute('data-theme',n==='malam'?'dark':'light');
    skyBtn.textContent=n;
    try{localStorage.setItem('ms-sky',n);localStorage.setItem('theme',n==='malam'?'dark':'light');}catch(e){}
  });

  /* bintang */
  var st=document.getElementById('stars'),frag=document.createDocumentFragment();
  for(var s=0;s<70;s++){
    var i=document.createElement('i');
    i.style.left=(Math.random()*100)+'%';i.style.top=(Math.random()*62)+'%';
    var z=Math.random()<.2?3:2;i.style.width=i.style.height=z+'px';
    i.style.animationDelay=(-Math.random()*4)+'s';i.style.animationDuration=(3+Math.random()*3)+'s';
    frag.appendChild(i);
  }
  st.appendChild(frag);

  /* paralaks halus pada bukit pasir */
  var layers=document.querySelectorAll('#dunes svg');
  window.addEventListener('pointermove',function(e){
    var dx=(e.clientX/window.innerWidth-.5);
    layers.forEach(function(l){l.style.transform='translateX('+(-dx*parseFloat(l.dataset.p)*600)+'px)';});
  },{passive:true});

  /* ── ikon SVG ── */
  var FLAG='<svg viewBox="0 0 20 20"><path d="M6 3v14" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M6.6 3.6L16 7l-9.4 3.6z" fill="#ffb067"/></svg>';
  var MINE='<svg viewBox="0 0 20 20"><g stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M15.7 4.3l-2.1 2.1M6.4 13.6l-2.1 2.1"/></g><circle cx="10" cy="10" r="4.6" fill="#fff"/></svg>';
  var CROSS='<svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="#ffb067" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var FACES={
    play:'<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="10.5"/><circle class="eye" cx="9.4" cy="11" r="1.3"/><circle class="eye" cx="16.6" cy="11" r="1.3"/><path d="M8.6 16 Q13 20 17.4 16"/></svg>',
    lose:'<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="10.5"/><path d="M8 9.6l3 3M11 9.6l-3 3M15 9.6l3 3M18 9.6l-3 3"/><path d="M9 18.4 Q13 15 17 18.4"/></svg>',
    win:'<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="10.5"/><path d="M7.2 11h5M13.8 11h5"/><path d="M8.2 15.4 Q13 21 17.8 15.4z" fill="#fff"/></svg>'
  };

  /* ── konfigurasi game ── */
  var LEVELS={
    mudah:{r:9,c:9,m:10,label:'mudah'},
    sedang:{r:16,c:16,m:40,label:'sedang'},
    sulit:{r:16,c:30,m:99,label:'sulit'}
  };
  var level='mudah';
  try{var sv=localStorage.getItem('ms-level');if(sv&&LEVELS[sv])level=sv;}catch(e){}

  var $=function(id){return document.getElementById(id);};
  var boardEl=$('board'),minesEl=$('mines'),timeEl=$('time'),faceEl=$('face'),msgEl=$('msg'),bestEl=$('best'),
      flagBtn=$('flagMode'),hintBtn=$('hintBtn'),retryBtn=$('retryBtn'),newBtn=$('newBtn'),progEl=$('prog'),
      segEl=$('seg'),resultEl=$('result'),rIcon=$('rIcon'),rTitle=$('rTitle'),rText=$('rText'),rBadge=$('rBadge'),
      rNew=$('rNew'),rRetry=$('rRetry'),rView=$('rView'),
      lvBtns=document.querySelectorAll('.lv');

  var R,C,M,cells,els,state,flags,opened,timer,secs,flagMode=false,started,layoutReady,layout,resTimer;

  function pad(n){n=Math.max(-99,Math.min(999,n));return (n<0?'-':'')+String(Math.abs(n)).padStart(n<0?2:3,'0');}
  function best(){try{return +localStorage.getItem('ms-best-'+level)||0;}catch(e){return 0;}}
  function showBest(){var b=best();bestEl.textContent=b?'REKOR '+LEVELS[level].label.toUpperCase()+' · '+b+' DETIK':'';}
  function setFace(k){faceEl.innerHTML=FACES[k];faceEl.classList.remove('bump');void faceEl.offsetWidth;faceEl.classList.add('bump');}
  function updProg(){progEl.style.width=(R*C-M?Math.round(opened/(R*C-M)*100):0)+'%';}

  function fitSize(){
    var avail=Math.min(window.innerWidth,980)-2*16-2*13-8;
    var cs=Math.floor((avail-(C-1)*3)/C);
    cs=Math.max(22,Math.min(38,cs));
    boardEl.style.setProperty('--cs',cs+'px');
  }

  function calcNumbers(){
    for(var i=0;i<R*C;i++){
      var n=0;neighbors(i).forEach(function(x){if(cells[x].mine)n++;});
      cells[i].n=n;
    }
  }

  /* keep=true → papan (letak ranjau) sama dipakai ulang */
  function init(keep){
    var L=LEVELS[level];
    var same=keep===true&&layout&&R===L.r&&C===L.c;
    R=L.r;C=L.c;M=L.m;
    clearInterval(timer);clearTimeout(resTimer);
    secs=0;started=false;state='ready';flags=0;opened=0;
    resultEl.classList.remove('show');
    cells=[];els=[];
    for(var i=0;i<R*C;i++)cells.push({mine:false,n:0,open:false,flag:false});
    if(same){layout.forEach(function(k){cells[k].mine=true;});calcNumbers();layoutReady=true;}
    else{layout=null;layoutReady=false;}
    boardEl.innerHTML='';boardEl.className='';
    boardEl.style.setProperty('--cols',C);
    fitSize();
    var frag=document.createDocumentFragment();
    for(var i=0;i<R*C;i++){
      var d=document.createElement('div');
      d.className='cell up';d.dataset.i=i;d.setAttribute('role','gridcell');
      frag.appendChild(d);els.push(d);
    }
    boardEl.appendChild(frag);
    minesEl.textContent=pad(M);timeEl.textContent='000';
    faceEl.innerHTML=FACES.play;
    msgEl.textContent=same?'Papan yang sama. Semoga kali ini lolos.':'';
    updProg();
    retryBtn.disabled=!layoutReady;
    lvBtns.forEach(function(b){b.classList.toggle('on',b.dataset.k===level);});
    segEl.style.setProperty('--i',Object.keys(LEVELS).indexOf(level));
    showBest();
  }

  function neighbors(i){
    var r=(i/C)|0,c=i%C,out=[];
    for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;
      var nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<R&&nc>=0&&nc<C)out.push(nr*C+nc);
    }
    return out;
  }

  function place(safe){
    var ban={};ban[safe]=1;neighbors(safe).forEach(function(n){ban[n]=1;});
    var pool=[];
    for(var i=0;i<R*C;i++)if(!ban[i])pool.push(i);
    for(var i=pool.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var t=pool[i];pool[i]=pool[j];pool[j]=t;}
    layout=pool.slice(0,M);
    layout.forEach(function(k){cells[k].mine=true;});
    calcNumbers();layoutReady=true;retryBtn.disabled=false;
  }

  function startTimer(){
    started=true;state='play';
    timer=setInterval(function(){secs++;timeEl.textContent=pad(secs);},1000);
  }

  function paint(i,anim){
    var c=cells[i],e=els[i];
    e.className='cell';e.innerHTML='';
    if(c.open){
      e.classList.add('open');
      if(c.mine){e.classList.add('mine');e.innerHTML=MINE;}
      else if(c.n){e.classList.add('n'+c.n);e.textContent=c.n;}
    }else{
      e.classList.add('up');
      if(c.flag){e.innerHTML=FLAG;if(anim)e.classList.add('flagged');}
    }
  }

  /* buka kotak + ripple (BFS, jeda animasi mengikuti jarak) */
  function reveal(i){
    var q=[[i,0]],h=0;
    while(h<q.length){
      var k=q[h][0],d=q[h][1];h++;
      var c=cells[k];
      if(c.open||c.flag)continue;
      c.open=true;opened++;paint(k);
      els[k].style.setProperty('--d',Math.min(d*32,700)+'ms');
      els[k].classList.add('pop');
      if(c.n===0&&!c.mine)neighbors(k).forEach(function(n){if(!cells[n].open&&!cells[n].flag)q.push([n,d+1]);});
    }
    updProg();
  }

  function showResult(kind,extra){
    var lose=kind==='lose';
    rIcon.innerHTML=FACES[kind];
    rTitle.textContent=lose?'Duar!':'Bukit aman';
    rText.textContent=lose
      ?'Kamu menginjak ranjau setelah membuka '+opened+' dari '+(R*C-M)+' kotak aman.'
      :'Selesai dalam '+secs+' detik di level '+LEVELS[level].label+'.';
    rBadge.hidden=!(extra&&extra.record);
    rRetry.style.display=lose?'':'none';
    resultEl.classList.add('show');
  }

  function lose(hit){
    state='over';clearInterval(timer);setFace('lose');
    var order=[];
    for(var i=0;i<R*C;i++){
      var c=cells[i];
      if(c.mine&&!c.flag&&i!==hit)order.push(i);
      else if(!c.mine&&c.flag){paint(i);els[i].classList.add('wrong');els[i].innerHTML=CROSS;}
    }
    // ranjau lain terbuka bergelombang dari titik injakan
    var hr=(hit/C)|0,hc=hit%C;
    order.sort(function(a,b){
      return (Math.abs(((a/C)|0)-hr)+Math.abs(a%C-hc))-(Math.abs(((b/C)|0)-hr)+Math.abs(b%C-hc));
    });
    order.forEach(function(k,n){
      cells[k].open=true;paint(k);
      els[k].style.setProperty('--d',Math.min(120+n*28,1100)+'ms');
      els[k].classList.add('pop');
    });
    els[hit].classList.add('boom');
    boardEl.classList.add('shake');
    msgEl.textContent='';
    resTimer=setTimeout(function(){showResult('lose');},Math.min(900+order.length*18,1500));
  }

  function win(){
    state='over';clearInterval(timer);setFace('win');
    for(var i=0;i<R*C;i++){var c=cells[i];if(c.mine&&!c.flag){c.flag=true;paint(i,true);}}
    minesEl.textContent=pad(0);
    // gelombang sorak dari pojok kiri atas
    for(var i=0;i<R*C;i++){
      var r=(i/C)|0,cc=i%C;
      els[i].style.setProperty('--d',((r+cc)*32)+'ms');
      els[i].classList.remove('pop','flagged');els[i].classList.add('cheer');
    }
    var b=best(),record=!b||secs<b;
    if(record){try{localStorage.setItem('ms-best-'+level,secs);}catch(e){}}
    showBest();
    var rec=record&&!!b;
    resTimer=setTimeout(function(){showResult('win',{record:rec});},950);
  }

  function checkWin(){if(opened===R*C-M)win();}

  function openCell(i){
    if(state==='over')return;
    var c=cells[i];
    if(c.flag)return;
    if(c.open){chord(i);return;}
    if(!started){if(!layoutReady)place(i);startTimer();}
    if(c.mine){c.open=true;paint(i);lose(i);return;}
    reveal(i);checkWin();
  }

  function toggleFlag(i){
    if(state==='over')return;
    var c=cells[i];if(c.open)return;
    c.flag=!c.flag;flags+=c.flag?1:-1;
    paint(i,true);minesEl.textContent=pad(M-flags);
    if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
  }

  function chord(i){
    var c=cells[i];if(!c.open||!c.n||state!=='play')return;
    var nb=neighbors(i),f=0;
    nb.forEach(function(n){if(cells[n].flag)f++;});
    if(f!==c.n)return;
    var hit=-1;
    nb.forEach(function(n){
      var x=cells[n];
      if(x.flag||x.open)return;
      if(x.mine){hit=n;}else reveal(n);
    });
    if(hit>=0){cells[hit].open=true;paint(hit);lose(hit);return;}
    checkWin();
  }

  function hint(){
    if(state==='over')return;
    document.querySelectorAll('.cell.hint').forEach(function(e){e.classList.remove('hint');});
    if(!started){
      if(layoutReady){
        var safe=[];for(var i=0;i<R*C;i++)if(!cells[i].mine)safe.push(i);
        openCell(safe[(Math.random()*safe.length)|0]);
      }else openCell(((R/2)|0)*C+((C/2)|0));
      return;
    }
    var cand=[];
    for(var i=0;i<R*C;i++){
      var c=cells[i];if(!c.open||!c.n)continue;
      var nb=neighbors(i),f=0,hid=[];
      nb.forEach(function(n){if(cells[n].flag)f++;else if(!cells[n].open)hid.push(n);});
      if(f===c.n&&hid.length)cand=cand.concat(hid);
    }
    cand=cand.filter(function(k){return !cells[k].mine;});
    if(!cand.length){
      for(var i=0;i<R*C;i++)if(!cells[i].open&&!cells[i].flag&&!cells[i].mine)cand.push(i);
    }
    if(!cand.length)return;
    var pick=cand[(Math.random()*cand.length)|0];
    els[pick].classList.add('hint');
    setTimeout(function(){els[pick].classList.remove('hint');},1900);
    secs+=10;timeEl.textContent=pad(secs); // penalti 10 detik
    msgEl.textContent='Petunjuk dipakai: +10 detik';
  }

  /* ── input ── */
  var pressTimer=null,longFired=false,moved=false,sx=0,sy=0;
  function idxFrom(t){var e=t.closest&&t.closest('.cell');return e?+e.dataset.i:-1;}

  boardEl.addEventListener('contextmenu',function(e){
    e.preventDefault();
    var i=idxFrom(e.target);if(i>=0)toggleFlag(i);
  });
  boardEl.addEventListener('pointerdown',function(e){
    longFired=false;moved=false;sx=e.clientX;sy=e.clientY;
    if(state!=='over'&&e.button!==2&&idxFrom(e.target)>=0)faceEl.innerHTML='<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="10.5"/><circle class="eye" cx="9.4" cy="11" r="1.3"/><circle class="eye" cx="16.6" cy="11" r="1.3"/><ellipse cx="13" cy="17.4" rx="2" ry="2.3"/></svg>';
    if(e.pointerType==='mouse')return;
    var i=idxFrom(e.target);if(i<0)return;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(function(){longFired=true;toggleFlag(i);},380);
  });
  boardEl.addEventListener('pointermove',function(e){
    if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8){moved=true;clearTimeout(pressTimer);}
  });
  function relFace(){if(state!=='over')faceEl.innerHTML=FACES.play;}
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    boardEl.addEventListener(ev,function(){clearTimeout(pressTimer);relFace();});
  });
  boardEl.addEventListener('click',function(e){
    if(longFired||moved){longFired=false;return;}
    var i=idxFrom(e.target);if(i<0)return;
    if(flagMode)toggleFlag(i);else openCell(i);
  });

  flagBtn.addEventListener('click',function(){flagMode=!flagMode;flagBtn.classList.toggle('on',flagMode);});
  hintBtn.addEventListener('click',hint);
  var fresh=function(){init(false);setFace('play');};
  var retry=function(){if(layoutReady){init(true);setFace('play');}};
  faceEl.addEventListener('click',fresh);
  newBtn.addEventListener('click',fresh);
  rNew.addEventListener('click',fresh);
  retryBtn.addEventListener('click',retry);
  rRetry.addEventListener('click',retry);
  rView.addEventListener('click',function(){resultEl.classList.remove('show');});
  lvBtns.forEach(function(b){
    b.addEventListener('click',function(){
      if(level===b.dataset.k)return;
      level=b.dataset.k;
      try{localStorage.setItem('ms-level',level);}catch(e){}
      init(false);
    });
  });

  var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(fitSize,100);});
  document.addEventListener('keydown',function(e){
    if(e.key==='r'||e.key==='R')fresh();
    else if(e.key==='u'||e.key==='U')retry();
    else if(e.key==='f'||e.key==='F')flagBtn.click();
  });

  init(false);
})();
</script>
</body>
</html>
