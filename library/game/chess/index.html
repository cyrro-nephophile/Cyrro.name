<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#ccff00"/>
<title>Catur — Cyrro Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9E%3C/text%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fcfbf7;--fg:#0a0a0a;--mut:#4b5240;--card:#fff;--lime:#ccff00;--pink:#ff0055;--sh:#0a0a0a;--sq-l:#fcfbf7;--sq-d:#a3c23a;--sel:#ffb3c7;--lastc:rgba(204,255,0,.55)}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f4f4f0;--mut:#b9c0a8;--card:#141414;--sh:#ccff00;--sq-l:#e9ecd9;--sq-d:#6e8a1e;--sel:#ff0055}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  height:100vh;height:100dvh;background:var(--bg);color:var(--fg);
  font-family:'Outfit',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 12px 12px;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(rgba(10,10,10,.14) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(10,10,10,.14) 1.5px,transparent 1.5px);
  background-size:120px 120px;
}
:root[data-theme="dark"] body{background-image:linear-gradient(rgba(244,244,240,.1) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(244,244,240,.1) 1.5px,transparent 1.5px)}
.framed .back{display:none}
.framed{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))!important}

/* header */
.top{width:100%;max-width:440px;display:flex;align-items:center;gap:12px;background:#101510;border:3px solid #0a0a0a;padding:8px 12px;box-shadow:6px 6px 0 var(--sh);flex:none}
.back{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;text-decoration:none;color:#0a0a0a;background:var(--lime);border:3px solid #0a0a0a;padding:7px 11px;box-shadow:3px 3px 0 #0a0a0a;white-space:nowrap}
.back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #0a0a0a}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;color:#fff;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-weight:400;font-size:clamp(15px,5vw,22px);line-height:1}
.ttl .vs{color:var(--lime)}
.ttl .sf{color:var(--pink)}

/* status & level */
.hud{width:100%;max-width:440px;height:64px;display:grid;grid-template-columns:1fr auto;gap:10px;flex:none}
.stat{background:var(--card);border:3px solid #0a0a0a;box-shadow:4px 4px 0 var(--sh);padding:4px 8px;min-width:0;min-height:0;overflow:hidden}
.stat small{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--mut)}
.stat b{display:block;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:22px;line-height:1.1;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-family:'Outfit',sans-serif;font-weight:600;font-size:.95rem;line-height:1.2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stat.lvl{padding:4px 8px;min-width:112px}
.stat.lvl select{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:var(--fg);background:var(--card);border:2px solid #0a0a0a;padding:4px 6px;width:100%;border-radius:0;margin-top:2px}

/* board */
.board{position:relative;background:#0a0a0a;border:4px solid #0a0a0a;box-shadow:8px 8px 0 var(--sh);padding:6px;flex:none}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:min(94vw,440px,max(260px,calc(100dvh - 330px)));aspect-ratio:1/1;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,8.6vw,42px);line-height:1;cursor:pointer;min-width:0;min-height:0}
.sq.l{background:var(--sq-l)}
.sq.d{background:var(--sq-d)}
.sq.sel{background:var(--sel)!important}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--lastc);pointer-events:none}
.sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(10,10,10,.28);pointer-events:none}
.sq.hint.cap::after{width:92%;height:92%;background:transparent;border:5px solid rgba(10,10,10,.28)}
.w{color:#fff;text-shadow:0 0 3px #000,0 0 1px #000}
.b{color:#111}

/* panel kontrol */
.panel{background:var(--card);border:3px solid #0a0a0a;box-shadow:4px 4px 0 var(--sh);padding:6px;width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.field{display:grid;gap:4px;min-width:0}
.field small{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--mut)}
select{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--fg);background:var(--card);border:3px solid #0a0a0a;padding:8px 8px;box-shadow:3px 3px 0 var(--sh);border-radius:0;width:100%}
.panel .btn{align-self:end}
.btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#0a0a0a;background:#fff;border:3px solid #0a0a0a;padding:10px 8px;box-shadow:3px 3px 0 #0a0a0a;cursor:pointer;white-space:nowrap;touch-action:manipulation;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #0a0a0a}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0a0a0a}
.btn.lime{background:var(--lime)}
.btn.pink{background:var(--pink);color:#fff}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:3px 3px 0 #0a0a0a}

/* dialog konfirmasi */
.confirm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,10,10,.85);padding:16px}
.confirm-box{background:#fcfbf7;color:#0a0a0a;border:3px solid #ccff00;box-shadow:5px 5px 0 #ccff00;padding:18px 16px;text-align:center;width:100%;max-width:340px}
.confirm-box h3{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:30px;line-height:1;margin-bottom:8px}
.confirm-box p{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;margin-bottom:16px}
.confirm-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

select:disabled{opacity:.5;cursor:not-allowed}
/* pop up hasil: di bawah, papan tetap kelihatan */
.toast{position:fixed;left:12px;right:12px;bottom:12px;z-index:50;display:flex;justify-content:center;pointer-events:none}
.toast .confirm-box{pointer-events:auto;max-width:440px;width:100%;padding:14px 14px}
.toast .confirm-box h3{font-size:26px;margin-bottom:6px}
.toast .confirm-box p{margin-bottom:12px}
.framed .toast{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.confirm-box.win{border-color:var(--lime);box-shadow:5px 5px 0 var(--lime)}
.confirm-box.lose{border-color:var(--pink);box-shadow:5px 5px 0 var(--pink)}
/* langkah */
.log{width:100%;max-width:440px;height:58px;background:var(--card);border:3px solid #0a0a0a;box-shadow:4px 4px 0 var(--sh);padding:5px 10px;overflow:hidden;flex:none}
.log small{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--mut);margin-bottom:2px}
#moves{display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:2px 2px 4px;scrollbar-width:none;color:var(--fg)}
#moves::-webkit-scrollbar{display:none}
#moves.empty{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut)}
.mvc{flex:none;display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;line-height:1;padding:4px 7px;border:2px solid #0a0a0a;box-shadow:2px 2px 0 #0a0a0a;background:#fff;color:#0a0a0a}
.mvc.dk{background:#0a0a0a;color:#fff}
.mvc .n{font-size:10px;color:#4b5240}
.mvc.now{background:var(--lime);color:#0a0a0a;animation:chipIn .3s cubic-bezier(.2,.9,.3,1.3) both}
.mvc.now .n{color:#0a0a0a}
@keyframes chipIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#panelGame .btn{padding:6px 6px;font-size:12px;box-shadow:2px 2px 0 #0a0a0a}
#panelGame .btn:hover{box-shadow:3px 3px 0 #0a0a0a}
#panelGame .btn:active{box-shadow:0 0 0 #0a0a0a}

/* ===== intro ===== */
.intro{position:fixed;inset:0;z-index:200;background:#0a0a0a;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:20px;transition:opacity .45s ease,visibility .45s;overflow:hidden}
.intro.out{opacity:0;visibility:hidden}
.intro::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(204,255,0,.12) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(204,255,0,.12) 1.5px,transparent 1.5px);background-size:40px 40px;animation:intro-grid 1.6s linear infinite;pointer-events:none}
.intro-t{position:relative;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:clamp(52px,18vw,96px);line-height:1;color:#fff;animation:intro-pop .6s cubic-bezier(.2,.9,.3,1.2) both,intro-glitch 2.4s steps(1) .8s infinite}
.intro-t .hl{color:var(--lime,#ccff00)}
.intro-s{position:relative;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--pink,#ff0055);animation:intro-rise .5s .35s both}
.intro-bar{position:relative;width:min(60vw,240px);height:14px;border:3px solid #fff;box-shadow:3px 3px 0 #ccff00;margin-top:12px;overflow:hidden}
.intro-bar i{display:block;height:100%;background:#ccff00;transform-origin:left;animation:intro-grow 1.1s .2s cubic-bezier(.6,0,.2,1) both}
@keyframes intro-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes intro-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes intro-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes intro-grid{to{background-position:40px 40px}}
@keyframes intro-glitch{0%,90%,100%{transform:none;text-shadow:none}91%{transform:translate(-3px,1px);text-shadow:3px 0 #ff0055,-3px 0 #ccff00}93%{transform:translate(3px,-1px);text-shadow:-3px 0 #ff0055,3px 0 #ccff00}95%{transform:none;text-shadow:none}}
@media (prefers-reduced-motion: reduce){.intro{display:none}}

/* ===== animasi ===== */
.sq .w,.sq .b{position:relative;z-index:1;transition:transform .15s}
.sq:active .w,.sq:active .b{transform:scale(.92)}
.sq.sel .w,.sq.sel .b{animation:selBob 1.1s ease-in-out infinite}
@keyframes selBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mv{position:relative;z-index:5;will-change:transform;animation:mvSlide .4s cubic-bezier(.22,.61,.36,1) both}
@keyframes mvSlide{from{transform:translate(var(--dx),var(--dy))}to{transform:translate(0,0)}}
@keyframes capPop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.sq.chk{background:#ff0055 !important;animation:chkPulse 1s ease-in-out infinite}
@keyframes chkPulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:inset 0 0 0 4px rgba(255,255,255,.9)}}
.sq.hint::after{animation:hintIn .18s ease-out both}
@keyframes hintIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
#status.flash{animation:statusFlash .45s ease-out}
@keyframes statusFlash{0%{background:#ccff00;color:#0a0a0a}100%{background:transparent}}
#moves.bump{animation:bump .3s ease-out}
@keyframes bump{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.toast:not([hidden]) .confirm-box{animation:toastIn .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes toastIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.board{transition:transform .2s}
.board.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion: reduce){
  .mv,.sq.ghost,.sq.chk,.sq.hint::after,.sq.sel .w,.sq.sel .b,#status.flash,#moves.bump,.toast:not([hidden]) .confirm-box,.board.shake{animation:none!important}
}

/* koordinat papan */
.cn{position:absolute;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;line-height:1;color:rgba(10,10,10,.7);pointer-events:none;z-index:0}
.cn.r{top:3px;left:4px}
.cn.f{bottom:3px;right:4px}
:root[data-theme="dark"] .cn{color:rgba(244,244,240,.8)}
:root[data-theme="dark"] .sq.d .cn{color:#fff}
/* bidak yang ditangkap: memudar sambil membesar */
.sq .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none;animation:ghostOut .45s ease-out both}
@keyframes ghostOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.45)}}

/* ===== pemilih tema papan ===== */
.tpick{position:relative;flex:none}
.tbtn{width:44px;height:44px;padding:4px;background:#fff;border:3px solid #0a0a0a;box-shadow:3px 3px 0 #0a0a0a;cursor:pointer;display:grid;grid-template-columns:1fr 1fr;touch-action:manipulation}
.tbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0a0a0a}
.tbtn i{display:block;border:1px solid #0a0a0a}
.tbtn i:nth-child(1),.tbtn i:nth-child(4){background:var(--bl,#fcfbf7)}
.tbtn i:nth-child(2),.tbtn i:nth-child(3){background:var(--bd,#a3c23a)}
.tmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;background:#fff;border:3px solid #0a0a0a;box-shadow:5px 5px 0 #0a0a0a;min-width:200px;padding:8px;display:grid;gap:6px}
.topt{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #0a0a0a;padding:6px 8px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:#0a0a0a;cursor:pointer;text-align:left;box-shadow:2px 2px 0 #0a0a0a;touch-action:manipulation}
.topt.on{background:var(--lime)}
.topt:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #0a0a0a}
.topt .sw{display:grid;grid-template-columns:1fr 1fr;width:26px;height:26px;border:2px solid #0a0a0a;flex:none}
.topt .sw i{display:block}
.topt .sw i:nth-child(1),.topt .sw i:nth-child(4){background:var(--bl)}
.topt .sw i:nth-child(2),.topt .sw i:nth-child(3){background:var(--bd)}
/* varian malam neon: bidak dan titik langkah harus tetap kebaca di papan gelap */
[data-board="malam"] .w{color:#fff;text-shadow:0 0 3px #000,0 0 1px #000}
[data-board="malam"] .b{color:#0a0a0a;text-shadow:0 0 2px #fff,0 0 1px #fff}
[data-board="malam"] .sq.hint::after{background:rgba(244,244,240,.35)}
[data-board="malam"] .sq.hint.cap::after{border-color:rgba(244,244,240,.35)}
[data-board="malam"] .cn{color:rgba(244,244,240,.75)}
</style>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-t">CATUR</div>
  <div class="intro-s">VS STOCKFISH</div>
  <div class="intro-bar"><i></i></div>
</div>

<header class="top">
  <a class="back" href="/library/">← BALIK</a>
  <div class="ttl"><span class="t1">CATUR</span> <span class="vs">VS</span> <span class="sf">STOCKFISH</span></div>
  <div class="tpick">
    <button class="tbtn" id="tBtn" type="button" aria-label="Pilih tema papan" aria-expanded="false"><i></i><i></i><i></i><i></i></button>
    <div class="tmenu" id="tMenu" hidden role="menu"></div>
  </div>
</header>

<div class="hud">
  <div class="stat"><small>STATUS</small><b id="status">Memuat mesin…</b></div>
  <div class="stat lvl"><small>LEVEL</small><select id="level"></select></div>
</div>

<div class="board">
  <div id="board" aria-label="Papan catur"></div>
</div>

<!-- panel setup: muncul saat belum/sedang pilih warna -->
<div class="panel" id="panelSetup" hidden>
  <div class="field"><small>KAMU</small>
    <select id="color">
      <option value="w">Putih</option>
      <option value="b">Hitam</option>
    </select>
  </div>
  <button class="btn lime" id="startBtn" type="button">MAINKAN</button>
</div>

<!-- panel saat partai berjalan -->
<div class="panel" id="panelGame" hidden>
  <button class="btn" id="undoBtn" type="button">UNDO</button>
  <button class="btn lime" id="newBtn" type="button">MULAI BARU</button>
</div>

<div class="log">
  <small>LANGKAH</small>
  <div id="moves">Belum ada langkah</div>
</div>

<div class="confirm" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="cfTitle">
  <div class="confirm-box">
    <h3 id="cfTitle">ULANG GAME?</h3>
    <p>Posisi sekarang bakal hilang.</p>
    <div class="confirm-row">
      <button class="btn pink" id="cfYes" type="button">YA, ULANG</button>
      <button class="btn lime" id="cfNo" type="button">BATAL</button>
    </div>
  </div>
</div>

<div class="toast" id="result" hidden role="dialog" aria-labelledby="resTitle">
  <div class="confirm-box" id="resBox">
    <h3 id="resTitle">—</h3>
    <p id="resText"></p>
    <div class="confirm-row">
      <button class="btn lime" id="resAgain" type="button">MAIN LAGI</button>
      <button class="btn" id="resClose" type="button">TUTUP</button>
    </div>
  </div>
</div>

<script src="chess.js"></script>
<script>
if (window.top !== window.self) document.body.classList.add('framed');
try {
  var _t = localStorage.getItem('theme');
  if (_t === 'dark' || _t === 'light') document.documentElement.setAttribute('data-theme', _t);
} catch (e) {}

const FILES = 'abcdefgh';
const GLYPH = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };

const game = new Chess();
const $board   = document.getElementById('board');
const $status  = document.getElementById('status');
const $moves   = document.getElementById('moves');
const $level   = document.getElementById('level');
const $color   = document.getElementById('color');
const $startBtn = document.getElementById('startBtn');
const $undo    = document.getElementById('undoBtn');
const $newBtn  = document.getElementById('newBtn');
const $panelSetup = document.getElementById('panelSetup');
const $panelGame  = document.getElementById('panelGame');
const $confirm = document.getElementById('confirm');
const $cfYes  = document.getElementById('cfYes');
const $cfNo   = document.getElementById('cfNo');
const $result = document.getElementById('result');
const $resBox = document.getElementById('resBox');
const $resTitle = document.getElementById('resTitle');
const $resText  = document.getElementById('resText');
const $resAgain = document.getElementById('resAgain');
const $resClose = document.getElementById('resClose');
let resultShown = false;

let playerColor = 'w';
let selected = null;
let legal = [];
let busy = false;          // engine lagi mikir
let engineReady = false;
let inSetup = true;        // true = layar pilih warna, belum main
let onBest = null;
let ignoreNext = false;
let pending = null;        // aksi yang menunggu konfirmasi
let pendingAnim = null;    // langkah terakhir untuk dianimasikan

for (let i = 0; i <= 20; i++) $level.add(new Option('Level ' + i, i, false, i === 5));

// ---------- Stockfish (Web Worker, file lokal) ----------
const engine = new Worker('stockfish.js');
engine.onmessage = (e) => {
  const line = String(e.data);
  if (line === 'readyok' && !engineReady) {
    engineReady = true;
    setLevel();
    enterSetup();
    return;
  }
  if (line.startsWith('bestmove')) {
    if (ignoreNext) { ignoreNext = false; return; }
    const mv = line.split(' ')[1];
    const cb = onBest; onBest = null;
    if (cb) cb(mv);
  }
};
engine.onerror = () => { $status.textContent = 'Gagal load stockfish.js'; };
engine.postMessage('uci');
engine.postMessage('isready');

function setLevel() {
  engine.postMessage('setoption name Skill Level value ' + $level.value);
}
$level.onchange = setLevel;

// ---------- Alur: setup -> main -> setup ----------
function enterSetup() {
  if (busy) { ignoreNext = true; engine.postMessage('stop'); }
  busy = false; onBest = null;
  inSetup = true;
  resultShown = false;
  pendingAnim = null;
  $result.hidden = true;
  selected = null; legal = [];
  game.reset();
  playerColor = $color.value;
  update();
}

function startGame() {
  if (!engineReady) return;
  inSetup = false;
  resultShown = false;
  pendingAnim = null;
  playerColor = $color.value;
  game.reset();
  selected = null; legal = [];
  setLevel();
  engine.postMessage('ucinewgame');
  update();
  if (game.turn() !== playerColor) askEngine();
}

function askEngine() {
  if (game.game_over()) return;
  busy = true;
  const ms = 200 + Number($level.value) * 150;
  onBest = (mv) => {
    busy = false;
    if (mv && mv !== '(none)') {
      const target = game.get(mv.slice(2, 4));
      const m = game.move({ from: mv.slice(0, 2), to: mv.slice(2, 4), promotion: mv[4] || 'q' });
      if (m) pendingAnim = { from: m.from, to: m.to, capPiece: target || (m.captured ? { type: m.captured, color: game.turn() } : null) };
    }
    update();
  };
  engine.postMessage('position fen ' + game.fen());
  engine.postMessage('go movetime ' + ms);
  updateChrome();
}

// ---------- Input pemain ----------
function onSquare(sq) {
  if (inSetup || !engineReady || busy || game.game_over() || game.turn() !== playerColor) return;
  const piece = game.get(sq);
  if (selected && legal.some(m => m.to === sq)) return playerMove(selected, sq);
  if (piece && piece.color === playerColor) select(sq);
  else select(null);
}

function select(sq) {
  selected = sq;
  legal = sq ? game.moves({ square: sq, verbose: true }) : [];
  render();
}

function playerMove(from, to) {
  const target = game.get(to);
  const m = game.move({ from, to, promotion: 'q' });
  selected = null; legal = [];
  if (!m) { update(); return; }
  pendingAnim = { from: m.from, to: m.to, capPiece: target || (m.captured ? { type: m.captured, color: game.turn() } : null) };
  update();
  if (!game.game_over()) askEngine();
}

function undo() {
  if (inSetup || busy || !engineReady || !game.history().length) return;
  game.undo();
  if (game.turn() !== playerColor && game.history().length) game.undo();
  selected = null; legal = [];
  update();
}

// konfirmasi sebelum mengulang partai yang sudah ada langkahnya
function askRestart(action) {
  if (game.history().length === 0) { action(); return; }
  pending = action;
  $confirm.hidden = false;
}
$cfYes.onclick = () => {
  $confirm.hidden = true;
  const a = pending; pending = null;
  if (a) a();
};
$cfNo.onclick = () => {
  $confirm.hidden = true; pending = null;
};

$resAgain.onclick = () => { $result.hidden = true; enterSetup(); };
$resClose.onclick = () => { $result.hidden = true; };

function showResult() {
  let title, text, cls;
  if (game.in_checkmate()) {
    const winner = game.turn() === 'w' ? 'b' : 'w';
    if (winner === playerColor) {
      title = 'KAMU MENANG!';
      text = 'Skakmat. Kamu ngalahin Stockfish di level ' + $level.value + '.';
      cls = 'win';
    } else {
      title = 'KALAH';
      text = 'Stockfish ngalahin kamu di level ' + $level.value + '. Mau coba lagi?';
      cls = 'lose';
    }
  } else {
    title = 'SERI';
    text = game.in_stalemate() ? 'Stalemate. Nggak ada yang menang.' : 'Partai seri. Nggak ada yang menang.';
    cls = '';
  }
  $resTitle.textContent = title;
  $resText.textContent = text;
  $resBox.className = 'confirm-box ' + cls;
  $result.hidden = false;
  resultShown = true;
}

$startBtn.onclick = startGame;
$newBtn.onclick = () => askRestart(enterSetup);
$undo.onclick = undo;
$color.onchange = () => {
  if (!inSetup) return;
  playerColor = $color.value;
  render();
};

// ---------- Render ----------
function update() {
  render();
  renderMoves();
  updateChrome();
}

function updateChrome() {
  $level.disabled = !inSetup;
  if (inSetup) {
    $panelSetup.hidden = false;
    $panelGame.hidden = true;
    $startBtn.disabled = !engineReady;
    $status.textContent = engineReady ? 'Pilih warna, lalu tekan MAINKAN' : 'Memuat mesin…';
    return;
  }
  $panelSetup.hidden = true;
  $panelGame.hidden = false;
  $undo.disabled = busy;
  $status.textContent = busy ? 'Komputer lagi mikir…' : statusText();
  $status.classList.remove('flash'); void $status.offsetWidth; $status.classList.add('flash');
  if (!busy && game.game_over() && !resultShown) {
    const lose = game.in_checkmate() && game.turn() === playerColor;
    if (lose) { $board.classList.remove('shake'); void $board.offsetWidth; $board.classList.add('shake'); }
    showResult();
  }
}

function statusText() {
  const side = game.turn() === 'w' ? 'Putih' : 'Hitam';
  if (game.in_checkmate()) {
    const winner = game.turn() === 'w' ? 'b' : 'w';
    return winner === playerColor ? 'Skakmat! Kamu menang 🎉' : 'Skakmat! Komputer menang';
  }
  if (game.in_stalemate()) return 'Stalemate, seri.';
  if (game.in_draw()) return 'Seri.';
  const who = game.turn() === playerColor ? 'giliran kamu' : 'giliran komputer';
  return (game.in_check() ? 'Skak! ' : '') + side + ', ' + who;
}

function coordOf(sq, flip) {
  const f = FILES.indexOf(sq[0]);
  const k = Number(sq[1]) - 1;
  return { c: flip ? 7 - f : f, r: flip ? k : 7 - k };
}

function render() {
  $board.innerHTML = '';
  const flip = playerColor === 'b';
  const board = game.board();
  const hist = game.history({ verbose: true });
  const last = hist[hist.length - 1];
  const anim = pendingAnim; pendingAnim = null;
  const cellPx = $board.clientWidth / 8 || 40;
  let checkSq = null;
  if (game.in_check()) {
    const kingColor = game.turn();
    outer: for (let i = 0; i < 64; i++) {
      const f = FILES[i % 8], rk = 8 - Math.floor(i / 8);
      const p = game.get(f + rk);
      if (p && p.type === 'k' && p.color === kingColor) { checkSq = f + rk; break outer; }
    }
  }

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const file = flip ? 7 - c : c;
      const rank = flip ? r : 7 - r;
      const sq = FILES[file] + (rank + 1);
      const piece = board[7 - rank][file];

      const cell = document.createElement('div');
      cell.className = 'sq ' + ((file + rank) % 2 === 0 ? 'd' : 'l');
      if (sq === selected) cell.classList.add('sel');
      if (last && (last.from === sq || last.to === sq)) cell.classList.add('last');
      if (sq === checkSq) cell.classList.add('chk');
      if (legal.some(m => m.to === sq)) {
        cell.classList.add('hint');
        if (piece) cell.classList.add('cap');
      }
      if (piece) {
        const s = document.createElement('span');
        s.className = piece.color === 'w' ? 'w' : 'b';
        s.textContent = GLYPH[piece.type];
        if (anim && sq === anim.to) {
          const a = coordOf(anim.from, flip), b = coordOf(anim.to, flip);
          s.classList.add('mv');
          s.style.setProperty('--dx', ((a.c - b.c) * cellPx) + 'px');
          s.style.setProperty('--dy', ((a.r - b.r) * cellPx) + 'px');
        }
        cell.appendChild(s);
      }
      if (anim && sq === anim.to && anim.capPiece) {
        const g = document.createElement('span');
        g.className = 'ghost ' + (anim.capPiece.color === 'w' ? 'w' : 'b');
        g.textContent = GLYPH[anim.capPiece.type];
        cell.appendChild(g);
      }
      if (c === 0) {
        const t = document.createElement('span');
        t.className = 'cn r';
        t.textContent = flip ? r + 1 : 8 - r;
        cell.appendChild(t);
      }
      if (r === 7) {
        const t = document.createElement('span');
        t.className = 'cn f';
        t.textContent = FILES[flip ? 7 - c : c];
        cell.appendChild(t);
      }
      cell.onclick = () => onSquare(sq);
      $board.appendChild(cell);
    }
  }
}

function renderMoves() {
  const h = game.history();
  $moves.innerHTML = '';
  if (!h.length) {
    $moves.classList.add('empty');
    $moves.textContent = 'Belum ada langkah';
    return;
  }
  $moves.classList.remove('empty');
  for (let i = 0; i < h.length; i++) {
    const white = i % 2 === 0;
    const chip = document.createElement('span');
    chip.className = 'mvc' + (white ? '' : ' dk') + (i === h.length - 1 ? ' now' : '');
    if (white) {
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = (i / 2 + 1) + '.';
      chip.appendChild(n);
    }
    chip.appendChild(document.createTextNode(h[i]));
    $moves.appendChild(chip);
  }
  $moves.scrollLeft = $moves.scrollWidth;
  $moves.classList.remove('bump'); void $moves.offsetWidth; $moves.classList.add('bump');
}

// ---------- Tema papan ----------
const THEMES = {
  klasik: { name: 'Klasik',      l: '#fcfbf7', d: '#a3c23a', sel: '#ffb3c7', last: 'rgba(204,255,0,.55)' },
  kayu:   { name: 'Kayu',        l: '#f0d9b5', d: '#b58863', sel: '#ffd27a', last: 'rgba(255,214,102,.6)' },
  laut:   { name: 'Laut',        l: '#e3f1fb', d: '#4f8fc0', sel: '#ffe08a', last: 'rgba(127,227,255,.6)' },
  malam:  { name: 'Malam Neon',  l: '#2a3340', d: '#1a202a', sel: '#ff0055', last: 'rgba(204,255,0,.45)' },
  retro:  { name: 'Retro Pink',  l: '#ffe6ef', d: '#ff7aa2', sel: '#ccff00', last: 'rgba(255,209,102,.6)' }
};
const $tBtn  = document.getElementById('tBtn');
const $tMenu = document.getElementById('tMenu');

function swatchStyle(t) {
  return '--bl:' + THEMES[t].l + ';--bd:' + THEMES[t].d + ';';
}

function applyBoard(t) {
  const root = document.documentElement;
  if (!THEMES[t]) t = 'klasik';
  const th = THEMES[t];
  if (t === 'klasik') {
    root.removeAttribute('data-board');
    ['--sq-l', '--sq-d', '--sel', '--lastc'].forEach(v => root.style.removeProperty(v));
  } else {
    root.setAttribute('data-board', t);
    root.style.setProperty('--sq-l', th.l);
    root.style.setProperty('--sq-d', th.d);
    root.style.setProperty('--sel', th.sel);
    root.style.setProperty('--lastc', th.last);
  }
  $tBtn.setAttribute('style', swatchStyle(t));
  try { localStorage.setItem('chess-board', t); } catch (e) {}
  buildMenu(t);
}

function buildMenu(current) {
  $tMenu.innerHTML = '';
  Object.keys(THEMES).forEach(key => {
    const b = document.createElement('button');
    b.className = 'topt' + (key === current ? ' on' : '');
    b.type = 'button';
    b.setAttribute('role', 'menuitem');
    b.setAttribute('style', swatchStyle(key));
    b.innerHTML = '<span class="sw"><i></i><i></i><i></i><i></i></span>';
    const label = document.createElement('span');
    label.textContent = THEMES[key].name;
    b.appendChild(label);
    b.onclick = (e) => {
      e.stopPropagation();
      applyBoard(key);
      closeMenu();
    };
    $tMenu.appendChild(b);
  });
}

function closeMenu() {
  $tMenu.hidden = true;
  $tBtn.setAttribute('aria-expanded', 'false');
}
$tBtn.onclick = (e) => {
  e.stopPropagation();
  const open = $tMenu.hidden;
  $tMenu.hidden = !open;
  $tBtn.setAttribute('aria-expanded', String(open));
};
document.addEventListener('click', (e) => {
  if (!$tMenu.hidden && !e.target.closest('.tpick')) closeMenu();
});

let savedBoard = 'klasik';
try { savedBoard = localStorage.getItem('chess-board') || 'klasik'; } catch (e) {}
applyBoard(savedBoard);

update();
</script>

(function(){
  var el=document.getElementById('intro');
  if(!el)return;
  setTimeout(function(){
    el.classList.add('out');
    setTimeout(function(){ el.remove(); },500);
  },1600);
})();
</script>
